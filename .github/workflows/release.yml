name: Build & Release ORACLE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release-win:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Windows Build Tools
        run: npm install -g windows-build-tools
        continue-on-error: true

      - name: Install dependencies
        run: npm install

      - name: Build packages
        run: npm run build --workspaces --if-present

      - name: Build + Release Electron app
        run: npm run release:win --workspace=apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build packages
        run: npm run build --workspaces --if-present

      - name: Build + Release Electron app
        run: npm run release:mac --workspace=apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build packages
        run: npm run build --workspaces --if-present

      - name: Build + Release Electron app
        run: npm run release:linux --workspace=apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
