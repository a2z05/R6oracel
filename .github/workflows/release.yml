name: Build & Release ORACLE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release-win:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Ensure app-builder binary exists
        run: |
          if not exist "node_modules\app-builder-bin\win\x64\app-builder.exe" (
            echo Downloading app-builder binary...
            node -e "require('child_process').execSync('node node_modules/app-builder-bin/install-app-builder.js', {stdio: 'inherit'})"
          )
        shell: cmd
        working-directory: .
        continue-on-error: true

      - name: Build + Release
        run: npm run release:win
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Ensure app-builder binary exists
        run: |
          if [ ! -f "node_modules/app-builder-bin/mac/app-builder" ]; then
            echo "Downloading app-builder binary..."
            node node_modules/app-builder-bin/install-app-builder.js || true
          fi
        working-directory: .

      - name: Build + Release
        run: npm run release:mac
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Ensure app-builder binary exists
        run: |
          if [ ! -f "node_modules/app-builder-bin/linux/app-builder" ]; then
            echo "Downloading app-builder binary..."
            node node_modules/app-builder-bin/install-app-builder.js || true
          fi
        working-directory: .

      - name: Build + Release
        run: npm run release:linux
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
