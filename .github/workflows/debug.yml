name: Debug Build

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install
        env:
          npm_config_msvs_version: "2022"

      - name: Check better-sqlite3
        run: node -e "require('better-sqlite3')" 2>&1

      - name: Check electron-vite location
        run: where npx 2>&1 && npx electron-vite --version 2>&1
        working-directory: apps/desktop

      - name: Try build from workspace
        run: npm run build 2>&1
        working-directory: apps/desktop

      - name: Check output
        run: if exist out (dir out /s /b) else (echo "No output directory")
        working-directory: apps/desktop
